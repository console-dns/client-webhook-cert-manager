apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.{{ .Values.groupName }}
  labels:
    {{- include "client-webhook-cert-manager.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" .Release.Namespace (include "client-webhook-cert-manager.servingCertificateName" .) | quote }}
spec:
  group: {{ .Values.groupName }}
  version: v1alpha1
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: {{ include "client-webhook-cert-manager.fullname" . }}
    namespace: {{ .Release.Namespace }}
    port: {{ .Values.service.port }}
