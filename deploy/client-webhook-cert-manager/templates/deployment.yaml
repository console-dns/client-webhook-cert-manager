apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "client-webhook-cert-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "client-webhook-cert-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.updateStrategy }}
  selector:
    matchLabels:
      {{- include "client-webhook-cert-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "client-webhook-cert-manager.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s|%t|%s" .Values.dnsAPI.timeout .Values.dnsAPI.insecureSkipTLSVerify .Values.dnsAPI.caBundleSecretRef.name | sha256sum }}
    spec:
      serviceAccountName: {{ include "client-webhook-cert-manager.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: webhook
          image: {{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ default .Chart.AppVersion .Values.image.tag }}{{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --secure-port={{ .Values.service.targetPort }}
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
          env:
            - name: GROUP_NAME
              value: {{ .Values.groupName | quote }}
            - name: DNS_API_TIMEOUT
              value: {{ .Values.dnsAPI.timeout | quote }}
            - name: DNS_API_INSECURE_SKIP_TLS_VERIFY
              value: {{ .Values.dnsAPI.insecureSkipTLSVerify | quote }}
            {{- if .Values.dnsAPI.caBundleSecretRef.name }}
            - name: DNS_API_CA_FILE
              value: /etc/console-dns/ca-bundle/{{ .Values.dnsAPI.caBundleSecretRef.key }}
            {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /readyz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: serving-cert
              mountPath: /tls
              readOnly: true
            {{- if .Values.dnsAPI.caBundleSecretRef.name }}
            - name: dns-api-ca
              mountPath: /etc/console-dns/ca-bundle
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: serving-cert
          secret:
            secretName: {{ include "client-webhook-cert-manager.servingSecretName" . }}
            defaultMode: 0440
        {{- if .Values.dnsAPI.caBundleSecretRef.name }}
        - name: dns-api-ca
          secret:
            secretName: {{ .Values.dnsAPI.caBundleSecretRef.name }}
            items:
              - key: {{ .Values.dnsAPI.caBundleSecretRef.key }}
                path: {{ .Values.dnsAPI.caBundleSecretRef.key }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
