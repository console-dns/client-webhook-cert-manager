name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check dependency pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(go list -m -f '{{.Version}}' github.com/console-dns/client)" = "v0.0.0-20250418013039-135fd950cbe2"

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          test -z "${files}" || { echo "gofmt required:"; echo "${files}"; exit 1; }

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/webhook

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Lint and smoke test chart
        run: make helm-test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build container without pushing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: client-webhook-cert-manager:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max


  integration:
    name: Integration (envtest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install setup-envtest
        shell: bash
        run: |
          set -euo pipefail
          GOTOOLCHAIN=local go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20260511180552-3be3f1bf2b2f

      - name: Download Kubernetes envtest assets
        id: envtest
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$(setup-envtest use -p path 1.36.2)"
          test -x "${asset_dir}/etcd"
          test -x "${asset_dir}/kube-apiserver"
          test -x "${asset_dir}/kubectl"
          echo "asset_dir=${asset_dir}" >>"${GITHUB_OUTPUT}"
          {
            echo "KUBEBUILDER_ASSETS=${asset_dir}"
            echo "TEST_ASSET_ETCD=${asset_dir}/etcd"
            echo "TEST_ASSET_KUBE_APISERVER=${asset_dir}/kube-apiserver"
            echo "TEST_ASSET_KUBECTL=${asset_dir}/kubectl"
          } >>"${GITHUB_ENV}"

      - name: Run integration tests
        run: make integration-test
